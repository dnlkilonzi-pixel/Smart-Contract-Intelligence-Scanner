  <text x="1156" y="380" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#ef4444" text-anchor="end">70 / 100</text>

  <rect x="880" y="396" width="276" height="1" fill="#334155"/>

  <text x="880" y="420" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Recent Activity</text>
  <text x="880" y="442" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">→ Token drain: 18,000 USDC</text>
  <text x="880" y="462" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">→ Flash loan: 500 ETH</text>
  <text x="880" y="482" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">→ Deployed: 0x2c9f…</text>
  <text x="880" y="502" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">→ Deployed: 0x7f3d…</text>

  <rect x="880" y="522" width="276" height="24" rx="8" fill="#ef444420" stroke="#ef444440" stroke-width="1"/>
  <text x="1018" y="538" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ef4444" text-anchor="middle">⚠ HIGH RUG-PULL RISK</text>
