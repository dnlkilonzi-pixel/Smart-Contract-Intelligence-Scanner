  <text x="880" y="326" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Flash Loan Activity</text>
  <text x="1156" y="326" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ef4444" text-anchor="end">Yes</text>

  <text x="880" y="352" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Rug-pull Score</text>
