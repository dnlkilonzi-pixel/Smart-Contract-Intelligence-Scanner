  <line x1="434" y1="352" x2="300" y2="460" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="434" y1="352" x2="580" y2="240" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
