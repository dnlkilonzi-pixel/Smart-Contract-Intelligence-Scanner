  <text x="1152" y="456" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="end">SWC-107</text>
  <text x="40" y="490" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">State variable updated after external ETH transfer. Classic reentrancy. Use checks-effects-interactions pattern.</text>
  <text x="40" y="510" font-family="monospace" font-size="10" fill="#64748b">contracts/Vault.sol:67 — function withdraw(uint256 amount)</text>

