  <text x="126" y="368" font-family="monospace" font-size="13" font-weight="700" fill="#f1f5f9">Proxy Upgrade Unprotected — Missing Access Control</text>
  <text x="1152" y="358" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="end">SWC-105</text>
  <text x="40" y="394" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">upgradeTo() can be called by any address. A malicious actor can replace the implementation contract.</text>
  <text x="40" y="414" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Detected by: <tspan fill="#38bdf8">Slither</tspan> · Confidence: <tspan fill="#f1f5f9">High</tspan></text>
  <text x="40" y="428" font-family="monospace" font-size="10" fill="#64748b">contracts/Proxy.sol:88 — function upgradeTo(address impl)</text>

