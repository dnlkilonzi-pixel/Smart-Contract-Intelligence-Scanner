  <rect x="24" y="530" width="1152" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="24" y="530" width="4" height="70" rx="2" fill="#f59e0b"/>
  <rect x="40" y="539" width="72" height="22" rx="6" fill="#f59e0b20" stroke="#f59e0b40" stroke-width="1"/>
  <text x="76" y="554" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">MEDIUM</text>
  <text x="124" y="554" font-family="monospace" font-size="13" font-weight="700" fill="#f1f5f9">tx.origin Authentication — Phishing Risk</text>
  <text x="1152" y="544" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="end">SWC-115</text>
  <text x="40" y="578" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">tx.origin used as authentication guard at line 31. Vulnerable to phishing via malicious contract.</text>
  <text x="40" y="594" font-family="monospace" font-size="10" fill="#64748b">contracts/Auth.sol:31 — require(tx.origin == owner)</text>
