  <rect x="24" y="344" width="1152" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="24" y="344" width="4" height="90" rx="2" fill="#a855f7"/>
  <rect x="40" y="353" width="72" height="22" rx="6" fill="#a855f720" stroke="#a855f740" stroke-width="1"/>
