  <text x="76" y="270" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">CRITICAL</text>
  <text x="126" y="270" font-family="monospace" font-size="13" font-weight="700" fill="#f1f5f9">Integer Overflow in ERC20.transfer()</text>
  <text x="1152" y="260" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="end">SWC-101</text>
  <text x="40" y="296" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Unchecked arithmetic in transfer() at line 142. An attacker can overflow the balance mapping to drain tokens.</text>
  <text x="40" y="316" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Detected by: <tspan fill="#38bdf8">Mythril</tspan> · Confidence: <tspan fill="#f1f5f9">High</tspan></text>
  <text x="40" y="330" font-family="monospace" font-size="10" fill="#64748b">contracts/Token.sol:142 — function transfer(address to, uint256 amount)</text>

